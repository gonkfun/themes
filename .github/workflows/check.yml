name: Theme checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme structure
        run: set -e; for t in themes/*/tests/validate.py; do python3 "$t"; done
      - name: Validate WordPress collection
        run: python3 scripts/validate-wordpress-collection.py
      - name: Check PHP syntax
        run: find themes/*/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate release ZIPs
        run: python3 -c "from pathlib import Path; import zipfile; assert all(zipfile.ZipFile(p).testzip() is None for p in Path('themes').glob('*/releases/*.zip'))"
