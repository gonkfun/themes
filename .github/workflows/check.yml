name: Theme checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme structure
        run: python3 themes/epoch/tests/validate.py
      - name: Check PHP syntax
        run: find themes/epoch/wordpress/epoch -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate release ZIPs
        run: python3 -c "from pathlib import Path; import zipfile; [zipfile.ZipFile(p).testzip() for p in Path('themes').glob('*/releases/*.zip')]"
